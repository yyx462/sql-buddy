[project]
name = "sql-buddy"
version = "0.2.0"
description = "MCP server for read-only database access (MySQL, ClickHouse)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pymysql>=1.1.0",
    "clickhouse-driver>=0.2.6",
    "pandas>=2.0.0",
]
license = { text = "MIT" }

[project.scripts]
sql-buddy = "server:main"
sql-buddy-init = "init:main"
